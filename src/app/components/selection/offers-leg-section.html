<section class="space-y-3">
  <div class="flex flex-wrap items-center justify-between gap-3">
    <h2 class="text-lg font-semibold">{{ title() }}</h2>
    <div class="flex flex-wrap items-center gap-4">
      <div class="flex items-center gap-2">
        <app-checkbox
          [inputId]="'direct-only-' + title()"
          [checked]="directOnly()"
          (checkedChange)="onDirectOnlyChange($event)"
        />
        <label appLabel [for]="'direct-only-' + title()" class="text-sm font-normal">
          Somente voos diretos
        </label>
      </div>
      <app-select
        [value]="sortBy()"
        (valueChange)="onSortChange($event)"
        [options]="sortOptions"
        ariaLabel="Ordenar resultados"
        class="w-44"
      />
    </div>
  </div>

  @if (visibleOffers().length === 0) {
    <p class="rounded-lg border border-dashed p-6 text-center text-sm text-muted-foreground">
      Nenhum voo encontrado para este trecho com os filtros atuais.
    </p>
  } @else {
    <div class="space-y-3">
      @for (offer of visibleOffers(); track offer.flightNumber; let index = $index) {
        <app-flight-offer-card
          [offer]="offer"
          [selectedFareFamilyId]="fareFamilyIdFor(offer)"
          (selectFare)="selectFare.emit({ ...$event, position: index + 1 })"
        />
      }
    </div>
  }
</section>
