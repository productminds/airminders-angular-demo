<div class="mx-auto flex min-h-svh max-w-5xl flex-col px-4 py-6 sm:px-6 lg:px-8">
  <app-step-indicator [currentPath]="currentPath()" (logoClick)="onLogoClick()" />

  <app-alert-dialog
    [(open)]="showRestartDialog"
    titleId="restart-dialog-title"
    descriptionId="restart-dialog-description"
  >
    <div class="grid gap-1.5 text-center sm:text-left">
      <h2 id="restart-dialog-title" class="text-lg font-semibold">Começar uma nova busca?</h2>
      <p id="restart-dialog-description" class="text-sm text-muted-foreground">
        Você perderá o progresso desta reserva.
      </p>
    </div>
    <div class="flex flex-col-reverse gap-2 sm:flex-row sm:justify-end">
      <button appButton variant="outline" (click)="showRestartDialog.set(false)">
        Continuar reserva
      </button>
      <button appButton (click)="confirmRestart()">Nova busca</button>
    </div>
  </app-alert-dialog>

  <main class="flex-1 py-6">
    <router-outlet />
  </main>
</div>
