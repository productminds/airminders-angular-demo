<div class="mx-auto max-w-3xl space-y-6">
  <div class="space-y-1">
    <h1 class="text-2xl font-semibold sm:text-3xl">Para onde vamos?</h1>
    <p class="text-muted-foreground">Busque voos por origem, destino, datas e classe da cabine.</p>
  </div>

  @if (status() === 'error') {
    <div appAlert variant="destructive">
      <lucide-icon [img]="AlertTriangleIcon" class="h-4 w-4" aria-hidden="true" />
      <h2 appAlertTitle>Não foi possível concluir a busca</h2>
      <div appAlertDescription>
        {{
          error()?.type === 'timeout'
            ? 'A busca demorou demais para responder. Tente novamente.'
            : 'Ocorreu um erro inesperado. Tente novamente.'
        }}
      </div>
    </div>
  }

  <div appCard>
    <div appCardContent class="p-4 sm:p-6">
      <app-search-form
        [isSubmitting]="status() === 'loading'"
        (submitSearch)="onSearch($event)"
        (interact)="onFormInteraction()"
      />
    </div>
  </div>
</div>
