<div class="mx-auto max-w-lg space-y-6">
  <div class="space-y-1">
    <h1 class="text-2xl font-semibold sm:text-3xl">Pagamento</h1>
    <p class="text-muted-foreground">Escolha como deseja pagar sua reserva.</p>
  </div>

  @if (status() === 'error') {
    <div appAlert variant="destructive">
      <lucide-icon [img]="AlertTriangleIcon" class="h-4 w-4" aria-hidden="true" />
      <h2 appAlertTitle>Pagamento não aprovado</h2>
      <div appAlertDescription>
        {{
          error()?.type === 'payment_declined'
            ? 'O pagamento foi recusado. Verifique os dados ou tente outro método.'
            : 'Ocorreu um erro inesperado ao processar o pagamento. Tente novamente.'
        }}
      </div>
    </div>
  }

  <app-payment-form
    [totalAmount]="breakdown().grandTotal"
    [isSubmitting]="status() === 'loading'"
    (pay)="onPay($event)"
    (methodSelected)="onMethodSelected($event)"
  />
</div>
