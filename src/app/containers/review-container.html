<div class="mx-auto max-w-3xl space-y-6">
  <div class="space-y-1">
    <h1 class="text-2xl font-semibold sm:text-3xl">Revise sua reserva</h1>
    <p class="text-muted-foreground">Confira os dados antes de seguir para o pagamento.</p>
  </div>

  <div class="space-y-3">
    <app-itinerary-leg-summary
      title="Ida"
      [offer]="outboundOffer()!"
      [fareFamily]="outboundFare()!"
    />
    @if (inboundOffer(); as inbound) {
      <app-itinerary-leg-summary title="Volta" [offer]="inbound" [fareFamily]="inboundFare()!" />
    }
  </div>

  <app-passenger-list-summary [passengers]="passengers()!" />
  <app-price-summary [breakdown]="breakdown()" />

  <div class="flex justify-end border-t pt-6">
    <button appButton (click)="onConfirm()">Ir para pagamento</button>
  </div>
</div>
